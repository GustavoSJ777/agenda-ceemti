# Desenvolvimento com recarga automática: docker compose -f docker-compose.dev.yml up
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    env_file: .env.local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
